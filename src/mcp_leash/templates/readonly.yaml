# mcp-leash policy: read-only access to the project directory.
# Reference: https://github.com/cuong404vn/mcp-leash/blob/main/docs/policy-reference.md
#
# ${PROJECT_DIR} is the directory given with --project-dir (default: the
# directory mcp-leash was started from). Rules are checked top to bottom and
# the first match wins. Tool names match the official filesystem server
# (@modelcontextprotocol/server-filesystem).
version: 1
default: deny                # block anything no rule allows
hide_denied_tools: true      # hide tools that can never run from the agent
audit:
  path: ~/.mcp-leash/audit.jsonl
  redact_keys: [token, password, api_key, authorization, secret]
rules:
  - id: no-writes
    tools: ['write_*', 'edit_*', 'create_*', 'move_*', 'delete_*', 'remove_*', 'rm']
    action: deny
    reason: This policy is read-only.

  # Matches secret values (key=value pairs with a long value, private keys,
  # GitHub, OpenAI and AWS key formats), not words such as "secret.txt".
  - id: no-credentials-in-arguments
    tools: ['*']
    action: deny
    when:
      - arg: '*'
        matches: '(?i)((api[_-]?key|secret|token|passw(or)?d)["'']?\s*[:=]\s*["'']?[A-Za-z0-9_\-/+=]{12,}|BEGIN [A-Z ]*PRIVATE KEY|\b(gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})\b)'
    reason: Arguments look like they contain a credential.

  - id: list-allowed-directories
    tools: ['list_allowed_directories']
    action: allow

  # read_multiple_files takes a list of paths, which v0.1 cannot check, so it
  # stays blocked by the default.
  - id: read-inside-project
    tools:
      - read_file
      - read_text_file
      - read_media_file
      - list_directory
      - list_directory_with_sizes
      - directory_tree
      - search_files
      - get_file_info
    action: allow
    when:
      - arg: path
        within: ['${PROJECT_DIR}']
