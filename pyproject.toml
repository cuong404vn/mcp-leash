[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-leash"
dynamic = ["version"]
description = "A firewall for your AI agent's tools: one YAML policy, enforced on any MCP server, with every call audited."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "cuong404vn" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "policy", "proxy", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/cuong404vn/mcp-leash"
Issues = "https://github.com/cuong404vn/mcp-leash/issues"
Changelog = "https://github.com/cuong404vn/mcp-leash/blob/main/CHANGELOG.md"

[project.scripts]
mcp-leash = "mcp_leash.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "coverage[toml]>=7.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/mcp_leash/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_leash"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "policies", "docs", "examples", "README.md", "README.vi.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["mcp_leash"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
