name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mcp_leash/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Check the changelog has notes for this version
        run: python3 .github/scripts/changelog_notes.py "${GITHUB_REF_NAME#v}"

      # Users install from the Git URL, which builds the same wheel.
      - name: Check the tagged commit installs and runs
        run: |
          uv build --wheel
          uv run --isolated --no-project --with dist/*.whl mcp-leash --version

  github-release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/changelog_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
